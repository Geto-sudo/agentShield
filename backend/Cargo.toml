[package]
name = "agentshield-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "AgentShield - garde-fou de depenses PayPal pour agents IA (prototype Sandbox)"
license = "MIT"

[lib]
name = "agentshield"
path = "src/lib.rs"

[[bin]]
name = "agentshield"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.4"
# Signature Ed25519 des entrées d'audit. 2.1.1 est la dernière version dont la
# MSRV (1.60) reste compatible avec le `rust-version = "1.75"` du projet.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = 2
